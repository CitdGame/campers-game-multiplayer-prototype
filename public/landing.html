<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campers – Camping Spiel</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <div class="scene">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="grass"></div>
    <div class="trees" id="trees"></div>
  </div>

  <div class="wrapper">
    <div class="header">
      <div class="logo-badge"><span>⛺ CAMPERS</span></div>
      <p class="tagline">Dein Campingplatz – Deine Regeln</p>
    </div>
    
    <div class="menu-panel">
      <button class="menu-btn" onclick="startSolo()">
        <span class="btn-icon">🎮</span>
        <span class="btn-text">
          <span class="btn-title">Solo spielen</span>
          <span class="btn-desc">Alleine gegen die KI</span>
        </span>
      </button>
      
      <button class="menu-btn" onclick="showMultiplayer()">
        <span class="btn-icon">🌐</span>
        <span class="btn-text">
          <span class="btn-title">Online Spielen</span>
          <span class="btn-desc">Mit Freunden spielen</span>
        </span>
      </button>
      
      <button class="menu-btn" onclick="showLeaderboard()">
        <span class="btn-icon">🏆</span>
        <span class="btn-text">
          <span class="btn-title">Bestenliste</span>
          <span class="btn-desc">Highscores ansehen</span>
        </span>
      </button>
    </div>
    
    <!-- Multiplayer Panel -->
    <div class="multiplayer-panel" id="multiplayerPanel" style="display:none;">
      <button class="back-btn" onclick="hideMultiplayer()">← Zurück</button>
      
      <input class="input-field" id="playerName" type="text" placeholder="DEIN NAME" maxlength="12">
      
      <button class="action-btn btn-create" onclick="createLobby()">
        <span>➕ Neue Lobby erstellen</span>
      </button>
      
      <div class="divider">oder</div>
      
      <input class="input-field" id="joinCode" type="text" placeholder="CODE EINGEBEN" maxlength="6" style="text-transform: uppercase;">
      <button class="action-btn btn-join" onclick="joinLobby()">
        <span>🚪 Lobby beitreten</span>
      </button>
    </div>
    
    <!-- Lobby Panel -->
    <div class="lobby-panel" id="lobbyPanel" style="display:none;">
      <button class="back-btn" onclick="leaveLobby()">← Verlassen</button>
      
      <p class="lobby-info">Teile diesen Code mit Freunden:</p>
      <div class="lobby-code" id="lobbyCode" onclick="copyCode()">------</div>
      
      <div class="player-slots" id="playerSlots"></div>
      <p id="lobbyStatus" class="lobby-status">Warte auf Spieler…</p>
      
      <button class="action-btn btn-start" id="startBtn" onclick="startGame()">
        🎮 Spiel starten
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ path: '/socket.io' });
    let lobbyCode = '';
    let playerName = '';
    
    socket.on('connect', () => {
      console.log('Connected to server');
    });
    
    function startSolo() {
      playerName = localStorage.getItem('soloPlayerName') || 'Spieler';
      const name = prompt('Dein Name:', playerName);
      if (name) {
        localStorage.setItem('soloPlayerName', name);
        window.location.href = '/game.html?solo=true&name=' + encodeURIComponent(name);
      }
    }
    
    function showMultiplayer() {
      document.getElementById('multiplayerPanel').style.display = 'block';
      document.querySelector('.menu-panel').style.display = 'none';
    }
    
    function hideMultiplayer() {
      document.getElementById('multiplayerPanel').style.display = 'none';
      document.querySelector('.menu-panel').style.display = 'flex';
    }
    
    function createLobby() {
      playerName = document.getElementById('playerName').value.trim() || 'Spieler';
      socket.emit('createLobby', { name: playerName });
    }
    
    function joinLobby() {
      playerName = document.getElementById('playerName').value.trim() || 'Spieler';
      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      if (code.length < 4) {
        alert('Bitte gib einen gültigen Code ein!');
        return;
      }
      socket.emit('joinLobby', { code, name: playerName });
    }
    
    socket.on('lobbyCreated', (data) => {
      lobbyCode = data.code;
      document.getElementById('lobbyCode').textContent = lobbyCode;
      document.getElementById('multiplayerPanel').style.display = 'none';
      document.getElementById('lobbyPanel').style.display = 'block';
      renderPlayerSlots(data.players);
    });
    
    socket.on('lobbyJoined', (data) => {
      lobbyCode = data.code;
      document.getElementById('lobbyCode').textContent = lobbyCode;
      document.getElementById('multiplayerPanel').style.display = 'none';
      document.getElementById('lobbyPanel').style.display = 'block';
      renderPlayerSlots(data.players);
    });
    
    socket.on('playerJoined', (data) => {
      renderPlayerSlots(data.players);
    });
    
    function renderPlayerSlots(players) {
      const container = document.getElementById('playerSlots');
      container.innerHTML = '';
      const icons = ['🏕️','🎒','🌲','🔥','🎣','⛺','🌻','🏔️'];
      
      for (let i = 0; i < 8; i++) {
        const filled = i < players.length;
        const div = document.createElement('div');
        div.className = 'slot ' + (filled ? 'filled' : '');
        div.innerHTML = filled ? `<b>${icons[i]}</b><br>${players[i].name}` : 'Wartet…';
        container.appendChild(div);
      }
      
      const status = document.getElementById('lobbyStatus');
      const startBtn = document.getElementById('startBtn');
      if (players.length < 2) {
        status.textContent = `Warte auf Spieler… (${players.length}/8) – mind. 2 benötigt`;
        startBtn.disabled = true;
      } else {
        status.textContent = `${players.length} Spieler bereit!`;
        startBtn.disabled = false;
      }
    }
    
    function startGame() {
      socket.emit('startGame', { lobbyCode });
    }
    
    socket.on('gameStarted', (data) => {
      window.location.href = '/game.html?lobby=' + lobbyCode;
    });
    
    function leaveLobby() {
      socket.emit('leaveLobby');
      document.getElementById('lobbyPanel').style.display = 'none';
      hideMultiplayer();
    }
    
    function copyCode() {
      navigator.clipboard.writeText(lobbyCode);
      alert('Code kopiert: ' + lobbyCode);
    }
    
    function showLeaderboard() {
      alert('Bestenliste kommt bald!');
    }
    
    // Generate trees
    const trees = ['🌲','🌳','🌴','🌵','🌿','🍃'];
    const treeContainer = document.getElementById('trees');
    for (let i = 0; i < 15; i++) {
      const tree = document.createElement('div');
      tree.className = 'tree';
      tree.textContent = trees[Math.floor(Math.random() * trees.length)];
      tree.style.fontSize = (40 + Math.random() * 30) + 'px';
      tree.style.animationDelay = (Math.random() * 5) + 's';
      treeContainer.appendChild(tree);
    }
  </script>
  <script src="/socket.io/socket.io.js"></script>
</body>
</html>
